<!doctype html>
<html lang="pt-BR">
  <head><meta charset="UTF-8"><title>Frontend 2</title></head>
  <body>
    <h1>Frontend 2</h1>
    <p>Versão: __APP_VERSION__</p>
    <pre id="result">Carregando...</pre>
    <script>
      fetch("__API_URL__/api/users").then((response) => response.json()).then((data) => {
        document.querySelector("#result").textContent = JSON.stringify(data, null, 2);
      });
    </script>
  </body>
</html>
